[control]
; 0.2.5: rate-limited controller with braking. Legacy gain/damping
; entries below are retained for compatibility, but do not tune this mode.
; Mouse counts to world-space target angle, in degrees.
sensitivity=0.10

; Outer-loop response. Raise gently (0.005 steps) if tracking feels lazy.
roll_gain=0.022
pitch_gain=0.026
yaw_gain=0.012
turn_pull=0.42
max_bank=65.0
smoothing=0.12

; Angular-rate damping and arrival dead zone. These prevent alternating
; full corrections after the nose has crossed the target direction.
roll_damping=0.008
pitch_damping=0.010
yaw_damping=0.30
dead_zone=1.25

; Flip one sign if that axis moves opposite to the target marker.
pitch_sign=1
roll_sign=-1
yaw_sign=-1

; Target-marker projection for the default chase camera.
horizontal_fov=100.0
vertical_fov=62.0

; Build 25201480 input layout: slot 1 is yaw.
pitch_slot=0
roll_slot=2
; Discovery: log input-block values that step like buttons (throttle/brake/high-G). 0 = off.
input_probe=0
; Chase camera turn rate toward the mouse direction (1/s): higher keeps the aim ring
; steadier on screen (War Thunder style); MouseFlight used 5.
camera_follow=12
; Chase camera distance behind and height above, m, along the view; camera_distance=0
; takes the game's own chase position. Cockpit and nose views keep the game's position.
camera_distance=30
camera_height=6
; Degrees added to the game's own FOV (it widens with speed and afterburner), chase view;
; 0 = the game's. near_view_fov_add: the same in the cockpit and nose views.
camera_fov_add=0
; Cockpit and nose views: 3 (default) as 0, the view turned toward the ring by near_view_follow
; of its offset, no further than leaves the HUD edge in view (half the view + near_view_hud deg)
; (War Thunder realistic cockpit); 0 the view fixed ahead; 1 the view turned to the mouse aim;
; 2 fixed until the aim is near_view_edge deg off centre. Hold F to look around.
near_view_camera=3
; (3: the ring reaches as far as turns the view to that limit, or 3 deg inside the screen; the box below is for 0)
near_view_follow=0.6
near_view_hud=8
near_view_edge=15
; near_view_camera=0 and 3: near_view_aim=1 the ring stays where the mouse puts it on screen, inside a
; box of near_view_box_x/_y of the half width/height (a mouse joystick, as War Thunder simulator:
; held off centre the aircraft keeps turning); 0 a world direction as in the chase view. F looks
; around in the aircraft frame (135 left/right, 75 up, 25 down). The mouse is scaled by the cockpit FOV.
near_view_aim=1
near_view_box_x=0.55
near_view_box_y=0.55
; Cockpit comfort: the ring reaches reach^near_view_expo of the mouse (1 linear; fine near the nose,
; all of it at the edge), the mouse x near_view_mouse; the view lags the aircraft by
; near_view_inertia s (0 rigid); its roll held near_view_level toward level (0 off, 1 level).
near_view_expo=1.5
near_view_mouse=1.0
near_view_inertia=0.06
near_view_level=0
near_view_fov_add=0
; Live telemetry to dev\Telemetry.cmd (UDP port on 127.0.0.1, e.g. 49731); 0 = off.
telemetry_port=0

[keys]
; Easiest in the game: the tuning panel (F3), its Keys page (Left/Right on the page row).
; Every key the mod uses. A name: F1-F24, a letter or digit, Up, Down, Left, Right, Backspace,
; Enter, Space, Tab, Shift, Ctrl, Alt, CapsLock, Insert, Delete, Home, End, PageUp, PageDown,
; Numpad0-Numpad9, MButton, XButton1/XButton2 (mouse back/forward side buttons), or a
; virtual-key code (0x26); none = off. Saved changes apply within half a second.
; Mouse aim on and off; the aim back on the nose.
toggle=F8
recenter=F9
; Held: look around (the mouse turns the view, not the aim).
free_look=F
; The mod's HUD (the rings) on and off; the flight control stays on.
hud=F7
; Held: a high-G pressed below 500 km/h enters the game's post-stall maneuver (the pitch is
; held centred as the high-G starts); an amber ring shows it held.
post_stall=XButton1
; The in-game tuning panel (these keys can be changed on its Keys page too), and its keys while
; it is open (kept from the game then).
tuning=F3
tuning_up=Up
tuning_down=Down
tuning_less=Left
tuning_more=Right
tuning_fine=Shift
tuning_undo=Backspace
; On the Keys page: the selected key is replaced by the next one pressed (Esc cancels, Delete is none).
tuning_bind=Enter
; Reading config.ini again (it is also read within half a second of being saved).
reload=F10
; Diagnostics: per-frame flight trace in the log, light performance counters, the camera state
; probe; in the hangar, the aircraft's rating tables and its geometry.
trace=F4
perf=F5
camera_probe=F6
hangar_specs=F7
hangar_geometry=F8

[tuning]
; Flight logic (docs/maneuver-spec.md, src/flight_logic.h). Saved changes apply
; in-game within a second. Delete a key to use its default.
; -- Measured aircraft model (calibration 2026-10-03, build 25201480) --
; Stick -> pure delay -> game input smoothing (*_input) -> aircraft response.
pitch_delay=0.24
pitch_input=0.36
; Smoothing when the stick moves back toward or past centre (s; logged stops).
pitch_release=0.10
pitch_tau=0.40
pitch_curve=1.1
pitch_pull=61
pitch_push=17
pitch_gravity=0.3
; Push authority grows with upright (negative-G limited; ~0 inverted in combat logs).
push_gravity=6.5
roll_delay=0.16
roll_input=0.06
roll_accel=220
roll_curve=1.3
roll_max_rate=150
roll_tau=0.8
; -- Rate control (tests/flight_sim.cpp) --
; 0.1 (was 0.25): less braking on the pitch rate; mouse nudges no longer start a stop-start (bench, 2026-10-05).
pitch_kd=0.1
roll_kv=1.5
pitch_brake=0.45
roll_brake=0.45
pitch_gain=2.5
; Extra pitch gain (fraction) inside the last few degrees, so the nose finishes into the circle.
pitch_gain_near=0.4
; Follow a moving target: its motion across the nose is flown as a rate (gain, low-pass s, limit deg/s).
lead_gain=1.0
; 0.4 (was 0.2): the mouse moves in strokes (still half the time, then ~1 deg in 0.14 s);
; at 0.2 each stroke read as the target darting and bounced the nose (2026-10-07).
lead_filter=0.4
lead_max=60
; While the roll must come first (lift past 90 deg from the target), the lead may only hurry the coming pull, not push against it (0 = off, as before 2026-10-05).
lead_gate=1
roll_gain=2.0
pitch_trim=1.0
pitch_trim_limit=4.0
; Keep the learned trim through maneuvers (0 = decay in turns; the nose then sat ~0.7 deg high).
pitch_trim_keep=1
; High-G turn (throttle + brake, or the single high-G button): pull authority multiplier.
highg_pull=1.4
pitch_slew=20
roll_slew=20
; Rate observer (1/s): model carries the rate, noisy measurement corrects it.
rate_observer=3
; Fast authority estimate: memory (s, 0 = off), low-pass (s), share of the estimated
; change applied, and limits. Follows speed-dependent stick effectiveness in combat.
authority_memory=2.0
authority_filter=1.0
authority_trust=0.6
authority_min=0.35
authority_max=2.0
; Opposite authority used to slow a still-wanted rotation (0 = full stick allowed).
; 0.3 (was 0): a pull is slowed with a third of the push, not a full push (logged: 60% of the pushing while banked was braking).
pitch_unload=0.3
; -- Per-aircraft identification: the model above is the prior; authority, response
; time and delay are identified in flight (memory in s; trusted after N s of data).
; ident_memory=0 disables it and flies the calibrated model.
ident_memory=0
ident_trust=3
; -- Maneuver (degrees; seconds where noted). One rule at every distance, decided each
; frame: roll the canopy (or, for targets close to straight below, the floor) toward the
; target within the bank limits below, pitch along it, rudder for the rest.
; Pitch follows the lift from far_start deg; inside near_end, the offset along canopy and wing.
near_end=3.0
far_start=20.0
; Wings level on arrival: at most level_per_deg deg of bank per deg still to go beyond
; level_inside (inside it the wings are held level).
level_per_deg=10
; Roll toward where a chased target will be in 0.3 s (gun tracking test, 2026-10-05).
pursuit_ahead=0.3
; No upright preference (target-switch test, 2026-10-05): the push choice still keeps small
; down corrections upright; a roll begun toward the target is no longer reversed into a push.
upright=0
level_inside=1.0
; Optional roll-out by time to go (deg/s of bank rolled off before arrival, after rollout_lag s); 0 = off.
rollout_rate=0
rollout_lag=0.25
; Most bank for a pull toward a target below the turn: slice_bank for small corrections, slice_deep
; from twice slice_from deg off, inverted only from invert_min_angle (fully 30 deg further).
slice_bank=90
slice_deep=135
slice_from=20
invert_min_angle=120
; A slice already flown is eased off (allowed: bank held - slice_ease, up to slice_hold), not cut.
slice_ease=10
slice_hold=135
; Push (floor toward the target) when the target is more than push_below deg off the lift the pull
; may use (leave at push_below_exit), or close to straight below the floor (roll < push_roll_enter).
push_below=60
push_below_exit=45
push_roll_enter=30
push_roll_exit=50
push_enter=120
push_exit=135
choice_margin=0.6
; 0 (was 0.3): a push is no longer favoured over a roll and pull.
push_bias=0
; A target moving faster than pursuit_speed deg/s (fully at twice it) is chased: no push trade.
pursuit_speed=4.0
; 1: a chased target's bank is not held to the level_per_deg limit (the lift stays on it).
; 0 (was 1): near the aim the target's side swung with each mouse stroke, a full roll each way (2026-10-07).
chase_level=0
; Fine search: within fine_angle deg, roll and rudder chosen by flying a few candidates ahead on the model (0 = rules only).
fine_search=1
; High-G (throttle and brake) beyond this many deg of the aim, the lift on its side: full pull, no early braking (0 = off).
highg_full_from=8
fine_pitch=0
; The look-ahead adds what is left after its horizon (weight; 0 = off) and lets its pitch follow the rules (1; 0 = held).
fine_to_go=3
fine_follow=1
; Pull starts during the roll: at most overlap_max deg of the roll expected over the pitch lag is credited.
overlap_max=30
tail_enter=160
tail_exit=145
tail_bank=50
; Near the ground, sinking (sea level within ground_guard s at the present sink rate), the aim above
; the nose and the canopy beyond escape_bank deg from the sky: roll it back up the short way, then pull.
; 135 and 5 s until 2026-10-06: banked 111-131 deg at 300 m the aircraft held its lift on a target
; below and was inverted, nose-down, when the escape began (bench, Selene/LADON low: 25 crashes of 108
; to 9 at 90 deg, 8 s and an aim no more than 10 deg down; landings unchanged).
escape_bank=90
ground_guard=8
; ...only while the aim is no more than this many deg below the horizon: an aim put further down is a
; dive the player asks for (a landing's steep banked spiral was rolled out of with no limit).
escape_aim_down=10
latch_limit=150
; -- Rudder trim near the target --
yaw_dead=0.2
yaw_gain=1.5
yaw_max_rate=6.0
yaw_damping=0.45
yaw_limit=0.6
yaw_slew=5.0
; Input calibration trigger: set to a new positive value to run once.
calibrate=0
; Post-stall test plan (FA-36 and others with it): set to a new positive value to arm; then each
; high-G pressed below 500 km/h runs one step (the script times the pull and the let-go).
maneuver_test=0
; Automatic AT trace: 1 = each maneuver, 2 = every frame (whole mission), 0 = off.
auto_trace=0
