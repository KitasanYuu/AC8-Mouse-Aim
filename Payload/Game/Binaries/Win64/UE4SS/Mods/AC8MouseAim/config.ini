[control]
; 0.2.5: rate-limited controller with braking. Legacy gain/damping
; entries below are retained for compatibility, but do not tune this mode.
; Mouse counts to world-space target angle, in degrees.
sensitivity=0.10

; Outer-loop response. Raise gently (0.005 steps) if tracking feels lazy.
roll_gain=0.022
pitch_gain=0.026
yaw_gain=0.012
turn_pull=0.42
max_bank=65.0
smoothing=0.12

; Angular-rate damping and arrival dead zone. These prevent alternating
; full corrections after the nose has crossed the target direction.
roll_damping=0.008
pitch_damping=0.010
yaw_damping=0.30
dead_zone=1.25

; Flip one sign if that axis moves opposite to the target marker.
pitch_sign=1
roll_sign=-1
yaw_sign=-1

; Target-marker projection for the default chase camera.
horizontal_fov=100.0
vertical_fov=62.0

; Build 25201480 input layout: slot 1 is yaw.
pitch_slot=0
roll_slot=2

[tuning]
; Flight logic (docs/maneuver-spec.md, src/flight_logic.h). Saved changes apply
; in-game within a second. Delete a key to use its default.
; -- Measured aircraft model (calibration 2026-10-03, build 25201480) --
; Stick -> pure delay -> game input smoothing (*_input) -> aircraft response.
pitch_delay=0.24
pitch_input=0.36
pitch_tau=0.40
pitch_curve=1.1
pitch_pull=61
pitch_push=26
pitch_gravity=9
roll_delay=0.16
roll_input=0.06
roll_accel=220
roll_curve=1.3
roll_max_rate=150
roll_tau=0.8
; -- Rate control (tests/flight_sim.cpp) --
pitch_kd=0.25
roll_kv=1.5
pitch_brake=0.45
roll_brake=0.45
pitch_gain=2.0
roll_gain=2.0
pitch_trim=0.5
pitch_trim_limit=4.0
pitch_slew=20
roll_slew=20
; -- Maneuver choice (degrees; choice_margin in seconds) --
near_end=3.0
far_start=20.0
near_bank_gain=3.0
near_bank_max=60.0
push_enter=120.0
push_exit=135.0
choice_margin=0.25
pull_full=60.0
pull_none=120.0
tail_enter=160.0
tail_exit=145.0
tail_bank=50.0
latch_limit=150.0
; Start leveling when time-to-target < rollout_lead x roll-out time (0 = after arrival).
rollout_lead=1.5
; -- Rudder trim near the target --
yaw_dead=0.2
yaw_gain=1.5
yaw_max_rate=6.0
yaw_damping=0.45
yaw_limit=0.6
yaw_slew=5.0
; Input calibration trigger: set to a new positive value to run once.
calibrate=0
