<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞控对比台</title>
<style>
/* A test bench: one row of chase cameras (one per controller, same maneuver, same
   moment), the paths overlaid, the scorecard, and strip charts with every controller
   on the same axes. Dark only, like the telemetry page beside it. */
:root {
  --bg: #0e1418;
  --panel: #151d22;
  --rule: #26323a;
  --grid: #1d2830;
  --ink: #dbe4e9;
  --muted: #84959f;
  --nose: #f2f5f7;
  --path: #5fd38a;
  --aim: #f29a4a;
  --warn: #f06e5c;
  --enemy: #e5534b;
  --good: #5fd38a;
  --font: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Consolas", "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.5; }
.app { display: grid; grid-template-rows: auto auto minmax(0, 1fr); height: 100%; gap: 8px; padding: 10px 14px; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 600; letter-spacing: .02em; }
.title { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
select, button, input[type=range] { font: inherit; color: var(--ink); }
select, button { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 8px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button[aria-pressed=true] { border-color: var(--ink); background: #1f2a31; }
:focus-visible { outline: 2px solid #4fb3d9; outline-offset: 1px; }
.spacer { flex: 1; }
.transport { display: flex; gap: 8px; align-items: center; flex: 1 1 360px; }
.transport input[type=range] { flex: 1; accent-color: #4fb3d9; min-width: 120px; }
.clock { font-family: var(--mono); min-width: 8ch; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); cursor: pointer; font-size: 12px; }
.chip i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.chip.off { opacity: .4; }
.note { color: var(--muted); font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; min-height: 0; }

.scene { display: grid; grid-template-rows: minmax(260px, 1.1fr) minmax(0, 1fr); gap: 8px; min-height: 0; }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 8px; min-height: 0; }
.cams { display: grid; gap: 8px; min-height: 0; }
.cam { position: relative; overflow: hidden; }
.cam canvas, .overlay canvas, .chart canvas { width: 100%; height: 100%; display: block; }
.cam canvas, .overlay canvas { cursor: grab; }
.cam .label { position: absolute; left: 8px; top: 6px; font-size: 12px; font-weight: 600; pointer-events: none; text-shadow: 0 1px 2px #000; }
.cam .read { position: absolute; left: 8px; bottom: 6px; right: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink); pointer-events: none;
             display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 0 14px; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.cam .read span { color: var(--muted); margin-right: 3px; }
.cam .sticks { position: absolute; right: 8px; top: 8px; width: 92px; display: grid; gap: 3px; pointer-events: none; }
.meter { position: relative; height: 6px; background: rgba(29, 40, 48, .85); border-radius: 3px; overflow: hidden; }
.meter i { position: absolute; top: 0; bottom: 0; }
.meter::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); }
.side { display: grid; grid-template-rows: minmax(180px, 1fr) auto; gap: 8px; min-height: 0; }
.overlay { position: relative; }
.overlay .title { position: absolute; left: 10px; top: 6px; pointer-events: none; }
.card { padding: 8px 10px; overflow: auto; max-height: 46vh; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 2px 6px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--rule); }
tbody td { font-family: var(--mono); font-size: 12px; border-bottom: 1px solid var(--grid); }
tbody td:first-child { font-family: var(--font); color: var(--muted); }
td.best { color: var(--good); font-weight: 600; }
td.na { color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(100px, 1fr); gap: 8px; min-height: 0; }
.chart { padding: 4px 8px 6px; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 100px; }
.chart .plot { position: relative; min-height: 0; cursor: crosshair; }
.chart .plot canvas { position: absolute; inset: 0; }

.overview { overflow: auto; padding: 10px 12px; }
.overview table td { cursor: default; }
.overview tbody tr { cursor: pointer; }
.overview tbody tr:hover td { background: #1b252c; }
.overview tr.group td { font-family: var(--font); color: var(--ink); font-weight: 600; background: #111a1f; cursor: default; }
.overview tr.total td { font-weight: 600; border-top: 1px solid var(--rule); }
.overview .explain { color: var(--muted); font-size: 12px; max-width: 980px; margin: 12px 0 0; }
.overview .explain b { color: var(--ink); font-weight: 600; }
.empty { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 40px; }
.empty code { font-family: var(--mono); color: var(--aim); }

@media (max-width: 1100px) {
  .app { height: auto; }
  .top { grid-template-columns: minmax(0, 1fr); }
  .scene { grid-template-rows: auto auto; }
  .cams { grid-auto-rows: 220px; }
  .side { grid-template-rows: 300px auto; }
  .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 120px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>飞控对比台</h1>
    <div role="group" aria-label="页面" class="chips">
      <button type="button" id="tabScene" aria-pressed="true">单场景</button>
      <button type="button" id="tabOverview" aria-pressed="false">总览评分</button>
    </div>
    <label class="title" for="cond">工况</label>
    <select id="cond"></select>
    <label class="title" for="scenario">场景</label>
    <select id="scenario"></select>
    <div class="transport" id="transport">
      <button id="play" type="button">▶ 播放</button>
      <select id="speed" aria-label="播放速度"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
      <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="时间">
      <span class="clock" id="clock">0.00 s</span>
    </div>
  </div>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <span class="note" id="note"></span>
  </div>

  <div class="scene" id="scene">
    <div class="top">
      <div class="cams" id="cams"></div>
      <div class="side">
        <div class="panel overlay"><span class="title">航迹叠加（拖动旋转 · 滚轮缩放 · 双击复位）</span><canvas id="overlay" aria-label="所有飞控的航迹叠加"></canvas></div>
        <div class="panel card" id="card"></div>
      </div>
    </div>
    <div class="charts" id="charts"></div>
  </div>

  <div class="panel overview" id="overview" hidden></div>
</div>

<script src="results/index.js"></script>
<script>
(() => {
'use strict';
const IDX = window.COMPARE_INDEX;
if (!IDX) {
  document.querySelector('.app').innerHTML = '<div class="empty"><div>还没有对比结果。先在仓库根目录运行 <code>dev\\compare\\compare.cmd</code>。</div></div>';
  return;
}
// Frame layout written by harness.cpp (every 4th 80 Hz step).
const F = { t: 0, x: 1, y: 2, z: 3, pitch: 4, yaw: 5, roll: 6, ax: 7, ay: 8, az: 9, angle: 10, q: 11, p: 12, r: 13,
            sp: 14, sr: 15, sy: 16, speed: 17, nz: 18, aoa: 19, ex: 20, ey: 21, ez: 22, ep: 23, eyaw: 24, er: 25,
            tgt: 26, kills: 27 };   // battles: the enemy being attacked (-1 none) and enemies down so far
const PALETTE = { ours: '#4fb3d9', upstream_legacy: '#f29a4a', upstream_coord: '#c38df2', pw5: '#5fd38a', recorded: '#e8e8e8' };
const EXTRA = ['#f5d04c', '#ff7aa8', '#8fd0c4', '#b0b8ff'];
const colorOf = (() => { let n = 0; const m = {}; return id => m[id] || (m[id] = PALETTE[id] || EXTRA[n++ % EXTRA.length]); })();
const KIND = { capture: '捕获（鼠标移到一个方向后不动）', switch: '换目标（滚转中出现新目标）', chain: '连续（中途换目标）',
               hold: '保持（对准后的小幅鼠标操作）', pursuit: '脚本追击（鼠标压在脚本敌机上）',
               track: '实录追击（录像里的真实敌机，鼠标压在机炮提前量上；白色为游戏里当时实际飞出的结果）',
               battle: '实战（录像里整段空战的全部敌机，虚拟飞行员选目标、导弹 + 机炮；粉色为精英机）' };
const KINDS = ['capture', 'switch', 'chain', 'hold', 'pursuit', 'track', 'battle'];
// Recorded scenes run only on the aircraft they were flown with.
const available = sc => !!(IDX.metrics[st.cond] || {})[sc.id];
const withEnemy = kind => kind === 'pursuit' || kind === 'track' || kind === 'battle';
const ELITE = '#ff6bd6';
// Battles: every enemy's path (2 Hz) and, per controller, when it brought each one down.
const foesOf = () => (runs() || {})._foes || [];
function foeAt(foe, t) {   // [class, elite, first, last, [[t, x, y, z], ...]] -> position and heading, or null
  if (t < foe[2] || t > foe[3]) return null;
  const pts = foe[4]; if (!pts.length) return null;
  let k = 1; while (k < pts.length - 1 && pts[k][0] < t) k++;
  const a = pts[Math.max(0, k - 1)], b = pts[Math.min(k, pts.length - 1)];
  const u = b[0] > a[0] ? Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))) : 0;
  const p = [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u];
  const d = sub([b[1], b[2], b[3]], [a[1], a[2], a[3]]), h = Math.hypot(d[0], d[1]);
  return { pos: enu(p), pitch: Math.atan2(d[2], h || 1) / rad, yaw: Math.atan2(d[1], d[0]) / rad };
}
function downBy(ctlId, t) {   // enemy indices this controller had brought down by time t
  const k = ((runs() || {})._kills || {})[ctlId] || [];
  return new Set(k.filter(e => e[0] <= t).map(e => e[1]));
}

// ---------- vectors (Unreal X north, Y east, Z up -> drawn as east/north/up) ----------
const rad = Math.PI / 180;
const enu = v => [v[1], v[0], v[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / n, a[1] / n, a[2] / n]; };
function basis(p, y, r) {   // flight::basis, Unreal coordinates
  p *= rad; y *= rad; r *= rad;
  const f = [Math.cos(p) * Math.cos(y), Math.cos(p) * Math.sin(y), Math.sin(p)];
  const right = [-Math.sin(y), Math.cos(y), 0], up = cross(f, right);
  return { f, r: sub(mul(right, Math.cos(r)), mul(up, Math.sin(r))), u: add(mul(up, Math.cos(r)), mul(right, Math.sin(r))) };
}
const posOf = fr => enu([fr[F.x], fr[F.y], fr[F.z]]);
const enemyPos = fr => enu([fr[F.ex], fr[F.ey], fr[F.ez]]);

// ---------- state ----------
const st = { cond: IDX.plants[0].id, scen: IDX.scenarios[0].id, t: 0, playing: false, speed: 1, hidden: new Set(), tab: 'scene' };
try { const saved = JSON.parse(localStorage.getItem('ac8-compare') || '{}');
  if (IDX.plants.some(p => p.id === saved.cond)) st.cond = saved.cond;
  if (IDX.scenarios.some(s => s.id === saved.scen)) st.scen = saved.scen;
  if (saved.tab === 'overview') st.tab = 'overview';
  (saved.hidden || []).forEach(id => st.hidden.add(id)); } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem('ac8-compare', JSON.stringify({ cond: st.cond, scen: st.scen, tab: st.tab, hidden: [...st.hidden] })); } catch (e) { /* ignore */ } }
const visible = () => IDX.controllers.filter(c => !st.hidden.has(c.id) && (IDX.metrics[st.cond][st.scen] || {})[c.id]);
const visibleAll = () => IDX.controllers.filter(c => !st.hidden.has(c.id));
const scenario = () => IDX.scenarios.find(s => s.id === st.scen);
const runs = () => (window.COMPARE_DATA && window.COMPARE_DATA[st.cond] || {})[st.scen];
function frameAt(arr, t) {
  if (!arr || !arr.length) return null;
  const step = arr.length > 1 ? arr[1][F.t] - arr[0][F.t] : 1;
  return arr[Math.max(0, Math.min(arr.length - 1, Math.round(t / step)))];
}
function indexAt(arr, t) { const step = arr.length > 1 ? arr[1][F.t] - arr[0][F.t] : 1; return Math.max(0, Math.min(arr.length - 1, Math.round(t / step))); }

// Per-condition frame data loads on demand (a few MB each).
function loadCond(cond, then) {
  if (window.COMPARE_DATA && window.COMPARE_DATA[cond]) { then(); return; }
  const s = document.createElement('script'); s.src = `results/data_${cond}.js`; s.onload = then;
  s.onerror = () => { document.getElementById('note').textContent = `读取 results/data_${cond}.js 失败`; };
  document.head.appendChild(s);
}

// ---------- canvas ----------
// Canvas sizes come from a ResizeObserver, not from reading the layout while drawing: each
// view also updates its readout, and a layout read after a DOM write forces a full
// relayout, a dozen times a frame (logged as stutter while playing battles).
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono');
const sizes = new WeakMap();
const sizeWatch = new ResizeObserver(entries => {
  for (const e of entries) sizes.set(e.target, [e.contentRect.width, e.contentRect.height]);
  requestAnimationFrame(() => drawAll());
});
// Filling the canvases is most of a frame's cost and grows with their area (a 3440x1440
// screen has four times the pixels of a laptop's): the pixel ratio is capped at 1.5 and a
// canvas's backing store at 0.7 megapixels, which the browser scales up to the view.
const MAX_CANVAS_PIXELS = 250000;
// Size a canvas to its view (pixel ratio and area capped as above) without clearing it.
function fit(canvas) {
  let size = sizes.get(canvas);
  if (!size) { sizeWatch.observe(canvas); const r = canvas.getBoundingClientRect(); size = [r.width, r.height]; sizes.set(canvas, size); }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(MAX_CANVAS_PIXELS / Math.max(1, size[0] * size[1])));
  const w = Math.max(1, Math.round(size[0])), h = Math.max(1, Math.round(size[1]));
  let resized = false;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); resized = true; }
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h, resized };
}
function setup(canvas) {
  let size = sizes.get(canvas);
  if (!size) { sizeWatch.observe(canvas); const r = canvas.getBoundingClientRect(); size = [r.width, r.height]; sizes.set(canvas, size); }
  const area = Math.max(1, size[0] * size[1]);
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(MAX_CANVAS_PIXELS / area));
  const w = Math.max(1, Math.round(size[0])), h = Math.max(1, Math.round(size[1]));
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
// near: points closer than this are dropped (a trail passing beside the camera would
// otherwise smear across the whole view).
function camera(C, target, w, h, fov, near = 0.5) {
  const fwd = norm(sub(target, C)), right = norm(cross(fwd, [0, 0, 1])), up = cross(right, fwd);
  const focal = (h / 2) / Math.tan(fov * rad / 2);
  return p => { const d = sub(p, C), z = dot(d, fwd); return z < near ? null : [w / 2 + focal * dot(d, right) / z, h / 2 - focal * dot(d, up) / z, z]; };
}
function lineIn(ctx, P, a, b, color, width = 1, dash = null, alpha = 1, steps = 16) {
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha; ctx.setLineDash(dash || []);
  ctx.beginPath(); let pen = false;
  for (let i = 0; i <= steps; i++) { const q = P(add(a, mul(sub(b, a), i / steps))); if (!q) { pen = false; continue; } pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true; }
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.lineWidth = 1;
}
// Jet outline in body axes (m): x forward, y right, z up.
const MESH = (() => {
  const tris = [], m = (a, b, c, shade) => { tris.push({ v: [a, b, c], shade }); tris.push({ v: [[a[0], -a[1], a[2]], [c[0], -c[1], c[2]], [b[0], -b[1], b[2]]], shade }); };
  m([3.5, 0.9, 0], [-4.5, 7.5, 0], [-6.5, 0.9, 0], 1.0);
  m([-5.6, 0.7, 0.1], [-8.6, 3.4, 0.1], [-8.9, 0.7, 0.1], 0.9);
  m([9.5, 0, 0.1], [-8.9, 0.95, 0.15], [-8.9, 0, 0.15], 0.8);
  tris.push({ v: [[-5.2, 0, 0.5], [-8.9, 0, 4.2], [-9.0, 0, 0.5]], shade: 0.7 });
  tris.push({ v: [[9.5, 0, 0.1], [-8.9, 0, 1.0], [-8.9, 0, -0.6]], shade: 0.6 });
  return tris;
})();
function drawJet(ctx, P, A, B, tint, scale = 1) {
  const f = enu(B.f), r = enu(B.r), u = enu(B.u);
  const tris = MESH.map(t => {
    const pts = t.v.map(p => add(A, mul(add(mul(f, p[0]), add(mul(r, p[1]), mul(u, p[2]))), scale)));
    const q = pts.map(P); if (q.some(x => !x)) return null;
    const n = norm(cross(sub(pts[1], pts[0]), sub(pts[2], pts[0])));
    const light = 0.45 + 0.55 * Math.abs(dot(n, norm([0.3, -0.4, 1])));
    // the belly side darker, so upright and inverted read at a glance
    const belly = dot(u, n) * (t.v[0][2] >= 0 ? 1 : 1) < 0;
    return { q, z: (q[0][2] + q[1][2] + q[2][2]) / 3, light: light * t.shade, belly };
  }).filter(Boolean).sort((a, b) => b.z - a.z);
  for (const t of tris) {
    ctx.fillStyle = tint; ctx.globalAlpha = 0.35 + 0.6 * t.light * (t.belly ? 0.55 : 1);
    ctx.strokeStyle = '#0b1114';
    ctx.beginPath(); ctx.moveTo(t.q[0][0], t.q[0][1]); ctx.lineTo(t.q[1][0], t.q[1][1]); ctx.lineTo(t.q[2][0], t.q[2][1]); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
// Wingtip ribbon between frames i0..i1: the band shows the roll; inverted parts orange.
function ribbon(ctx, P, arr, i0, i1, half, color, alpha, every = 1) {
  const pts = [];
  for (let i = Math.max(0, i0); i <= i1; i += every) {
    const fr = arr[i], B = basis(fr[F.pitch], fr[F.yaw], fr[F.roll]), c = posOf(fr), wr = enu(B.r);
    pts.push({ c: P(c), l: P(sub(c, mul(wr, half))), r: P(add(c, mul(wr, half))), inv: B.u[2] < 0 });
  }
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k]; if (!a.l || !a.r || !b.l || !b.r) continue;
    ctx.fillStyle = b.inv ? '#f29a4a' : color; ctx.globalAlpha = (b.inv ? 1.6 : 1) * alpha;
    ctx.beginPath(); ctx.moveTo(a.l[0], a.l[1]); ctx.lineTo(b.l[0], b.l[1]); ctx.lineTo(b.r[0], b.r[1]); ctx.lineTo(a.r[0], a.r[1]); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const [key, c, wd] of [['l', '#e5534b', 1], ['r', '#5fd38a', 1], ['c', color, 1.6]]) {
    ctx.strokeStyle = c; ctx.lineWidth = wd; ctx.globalAlpha = Math.min(1, alpha * 5); ctx.beginPath(); let pen = false;
    for (const s of pts) { const q = s[key]; if (!q) { pen = false; continue; } pen ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); pen = true; }
    ctx.stroke();
  }

function drawCams() {

// ---------- overlay of every path ----------
const over = { yaw: -35, pitch: 28, dist: null };

    box.appendChild(el);

    const valid = vals.filter((v, k) => shown[k] !== null && !isNaN(parseFloat(shown[k])));
    const best = better === 0 || !valid.length ? null : better < 0 ? Math.min(...valid) : Math.max(...valid);
    html += `<tr><td>${label}${unit ? `（${unit}）` : ''}</td>${vals.map((v, k) => shown[k] === null ? `<td class="na">${key === 'to_shot' ? '未开火' : '未达到'}</td>`
      : `<td class="${best !== null && v === best && valid.length > 1 ? 'best' : ''}">${shown[k]}</td>`).join('')}</tr>`;
  }
  document.getElementById('card').innerHTML = html + '</tbody></table>';
}

// ---------- overview ----------
function drawOverview() {
  const list = visibleAll(), M = IDX.metrics[st.cond];
  let html = `<table><thead><tr><th>场景（${IDX.plants.find(p => p.id === st.cond).title}）</th>${list.map(c => `<th style="color:${colorOf(c.id)}">${c.label}</th>`).join('')}</tr></thead><tbody>`;
  const totals = {}, all = {};
  list.forEach(c => { all[c.id] = 0; });
  for (const kind of KINDS) {
    if (!IDX.scenarios.some(s => s.kind === kind)) continue;
    html += `<tr class="group"><td colspan="${list.length + 1}">${KIND[kind]}</td></tr>`;
    list.forEach(c => { totals[c.id] = null; });
    for (const sc of IDX.scenarios.filter(s => s.kind === kind)) {
      if (!M[sc.id]) continue;
      const costs = list.map(c => M[sc.id][c.id] && M[sc.id][c.id].cost >= 0 ? M[sc.id][c.id].cost : null), best = Math.min(...costs.filter(v => v !== null));
      list.forEach((c, k) => { if (costs[k] === null) return; totals[c.id] = (totals[c.id] || 0) + costs[k]; if (c.id !== 'recorded') all[c.id] += costs[k]; });
      html += `<tr data-scen="${sc.id}"><td>${sc.title}</td>${costs.map(v => {
        if (v === null) return '<td class="na">—</td>';
        const r = Math.min(1, (v / Math.max(best, .05) - 1) / 1.5);   // 0 best .. 1 at 2.5x best
        const bg = `rgba(${Math.round(60 + 180 * r)}, ${Math.round(160 - 90 * r)}, ${Math.round(110 - 60 * r)}, ${.12 + .25 * r})`;
        return `<td style="background:${bg}" class="${v === best ? 'best' : ''}">${v.toFixed(2)}</td>`; }).join('')}</tr>`;
    }
    const tb = Math.min(...list.map(c => totals[c.id]).filter(v => v !== null));
    html += `<tr class="total"><td>小计</td>${list.map(c => totals[c.id] === null ? '<td class="na">—</td>' : `<td class="${totals[c.id] === tb ? 'best' : ''}">${totals[c.id].toFixed(1)}</td>`).join('')}</tr>`;
  }
  const ab = Math.min(...list.filter(c => c.id !== 'recorded').map(c => all[c.id]));
  html += `<tr class="total"><td>合计（模拟）</td>${list.map(c => c.id === 'recorded' ? '<td class="na">—</td>' : `<td class="${all[c.id] === ab ? 'best' : ''}">${all[c.id].toFixed(1)}</td>`).join('')}</tr></tbody></table>`;
  html += `<div class="explain"><p><b>综合代价</b>越低越好，每个场景一个数，权重是粗略的，具体差在哪里要看单场景页的指标。
    捕获、换目标和连续：到 2° 的时间 + 0.5 × 稳定在 1° 内的时间 + 超过 1.5° 的过冲 ×2 + 多余的滚转反向 ×0.5 + 杆量来回打 ×0.2 + 倒飞时间 ×0.5（倒飞起始的场景不计倒飞）；没达到按场景时长计。
    保持：偏差均方根 + 坡度均方根 ×0.05 + 滚转反向 ×0.3 + 杆量来回打 ×0.1。脚本追击：开始 3 s 后的平均偏差 ×0.5 + 不在 5° 内的时间占比 ×3 + 滚转反向 ×0.2 + 杆量来回打 ×0.05。
    实战：未击落的比例 ×20 + 选定目标到首次开火的平均秒数（没开过火按 15）+ 1 km 内不在提前量 2° 内的比例 ×5；“游戏实录”缺开火数据，只列击落等指标，不给综合分。
    头目战（LADON，不计击落）：不在导弹锁定范围内的比例 ×10（ECM：1 km 内才能锁定）+ 1 km 内不在提前量 2° 内的比例 ×10 + 平均偏差 ×0.2，滚转反向和杆量来回打按每分钟计。鼠标回放的实战按实录追击的方法计分。坠地后剩余的时间按完全偏离计。
    虚拟飞行员按“离机头近、距离近”选目标，鼠标压在机炮提前量上，目标偏离机头 40° 以上时按住加速+减速做高G转弯；机头 15° 内、300–2500 m 保持 0.8 s 发射导弹（每 1.5 s 一枚，普通敌机必中；精英机要在 1500 m 内、8° 内发射才命中，且要两发）；1 km 内机炮命中累计 0.5 s 击落（精英 1.5 s）。敌机按录像轨迹飞、不会对模拟里的飞机做反应，并在你当时把它打下来的时刻退场。
    实录追击：1 s 后对机炮提前量的平均偏差 ×0.5 + 不在 5° 内的占比 ×2 + 不在 2° 内的占比 ×2 + 滚转反向 ×0.2 + 杆量来回打 ×0.05；
    “游戏实录”一列是当时游戏里实际飞出的结果，按同样方法打分，可用来核对模拟是否可信（模拟从同一状态出发但不带当时的角速度）。</p>
    <p><b>模型</b>：姿态响应（延迟、游戏的输入平滑、响应曲线、拉杆/推杆权限、滚转加速度和上限、高G拉杆、方向舵约 5.4°/s）和航迹（速度方向滞后机头 0.2 s、重力、油门与速度）来自游戏时钟录下的飞行。
    权限和满油门加速度按速度分段实测：差机体到 500 m/s 满杆约 43°/s、600–700 m/s 只剩 6–10°/s，极速约 640 m/s；Su-35 在 600–800 m/s 仍有 26–28°/s，极速约 795 m/s。
    “迟钝机体”是差机体的延迟 ×1.3、权限 ×0.75，检验对模型误差的鲁棒性。录像场景只在当时所飞的机型上运行。场景清单见 dev/compare/scenes.txt。</p>
    <p><b>控制器</b>：${IDX.controllers.map(c => `<span style="color:${colorOf(c.id)}">${c.label}</span>（${c.source}）`).join('；')}。点击任一行打开该场景。</p></div>`;
  const box = document.getElementById('overview'); box.innerHTML = html;
  box.querySelectorAll('tr[data-scen]').forEach(tr => tr.addEventListener('click', () => { st.scen = tr.dataset.scen; document.getElementById('scenario').value = st.scen; setTab('scene'); selectScenario(); }));
}

// ---------- interaction ----------
function dragOrbit(canvas, o, redraw) {
  let last = null;
  canvas.addEventListener('pointerdown', e => { last = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
  canvas.addEventListener('pointerup', () => { last = null; canvas.style.cursor = ''; });
  canvas.addEventListener('pointermove', e => {
    if (!last) return;
    o.yaw += (e.clientX - last[0]) * .4; o.pitch = Math.max(-80, Math.min(85, o.pitch + (e.clientY - last[1]) * .3));
    last = [e.clientX, e.clientY]; redraw();
  });
  canvas.addEventListener('wheel', e => { e.preventDefault();
    if (o.dist === null || o === over) o.dist = Math.max(.2, Math.min(4, (o.dist || 1.15) * (e.deltaY > 0 ? 1.12 : 1 / 1.12)));
    else o.dist = Math.max(20, Math.min(600, o.dist * (e.deltaY > 0 ? 1.12 : 1 / 1.12)));
    redraw(); }, { passive: false });
  canvas.addEventListener('dblclick', () => { if (o === over) Object.assign(o, { yaw: -35, pitch: 28, dist: null }); else Object.assign(o, { yaw: 0, pitch: 12, dist: 70 }); redraw(); });
}
dragOrbit(document.getElementById('overlay'), over, () => drawOverlay());

function buildChips() {
  const box = document.getElementById('chips'); box.innerHTML = '';
  for (const c of IDX.controllers) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (st.hidden.has(c.id) ? ' off' : '');
    b.title = c.source; b.setAttribute('aria-pressed', String(!st.hidden.has(c.id)));
    b.innerHTML = `<i style="background:${colorOf(c.id)}"></i>${c.label}`;
    b.addEventListener('click', () => {
      if (st.hidden.has(c.id)) st.hidden.delete(c.id); else if (visibleAll().length > 1) st.hidden.add(c.id);
      save(); buildChips(); buildCams(); drawAll(); if (st.tab === 'overview') drawOverview();
    });
    box.appendChild(b);
  }
}
function fillSelects() {
  const cond = document.getElementById('cond');
  cond.innerHTML = IDX.plants.map(p => `<option value="${p.id}">${p.title}</option>`).join(''); cond.value = st.cond;
  const sel = document.getElementById('scenario');
  const here = IDX.scenarios.filter(available);
  if (!here.some(s => s.id === st.scen) && here.length) st.scen = here[0].id;
  sel.innerHTML = KINDS.filter(k => here.some(s => s.kind === k)).map(k => `<optgroup label="${KIND[k]}">${here.filter(s => s.kind === k).map(s => `<option value="${s.id}">${s.title}</option>`).join('')}</optgroup>`).join('');
  sel.value = st.scen;
}
function selectScenario() {
  save(); st.t = 0; computeExtent(); buildCams();
  const sc = scenario(); document.getElementById('note').textContent = sc.note || '';
  drawAll();
}
function setTab(tab) {
  st.tab = tab; save();
  document.getElementById('tabScene').setAttribute('aria-pressed', String(tab === 'scene'));
  document.getElementById('tabOverview').setAttribute('aria-pressed', String(tab === 'overview'));
  document.getElementById('scene').hidden = tab !== 'scene';
  document.getElementById('overview').hidden = tab !== 'overview';
  document.getElementById('transport').style.visibility = tab === 'scene' ? '' : 'hidden';
  document.getElementById('scenario').disabled = tab !== 'scene';
  document.getElementById('note').style.visibility = tab === 'scene' ? '' : 'hidden';
  if (tab === 'overview') drawOverview(); else drawAll();
}
function drawAll() {
  if (st.tab !== 'scene') return;
  const T = scenario().seconds;
  document.getElementById('clock').textContent = `${st.t.toFixed(2)} s`;
  document.getElementById('scrub').value = String(Math.round(st.t / T * 1000));
  // per-part drawing time, smoothed (window.ac8compare.timing, for finding stutter)
  const timing = st.timing || (st.timing = {});
  for (const [name, draw] of [['cams', drawCams], ['overlay', drawOverlay], ['card', drawCard], ['charts', drawCharts]]) {
    const t0 = performance.now(); draw();
    timing[name] = (timing[name] || 0) * 0.9 + (performance.now() - t0) * 0.1;
  }
}

document.getElementById('cond').addEventListener('change', e => {
  st.cond = e.target.value; fillSelects(); save();
  loadCond(st.cond, () => { st.t = 0; computeExtent(); buildCams(); drawAll(); if (st.tab === 'overview') drawOverview(); });
});
document.getElementById('scenario').addEventListener('change', e => { st.scen = e.target.value; selectScenario(); });
document.getElementById('scrub').addEventListener('input', e => { st.t = e.target.value / 1000 * scenario().seconds; drawAll(); });
document.getElementById('speed').addEventListener('change', e => { st.speed = parseFloat(e.target.value); });
document.getElementById('tabScene').addEventListener('click', () => setTab('scene'));
document.getElementById('tabOverview').addEventListener('click', () => setTab('overview'));
const playBtn = document.getElementById('play');
function setPlaying(on) { st.playing = on; playBtn.textContent = on ? '❚❚ 暂停' : '▶ 播放'; if (on && st.t >= scenario().seconds - 0.01) st.t = 0; }
playBtn.addEventListener('click', () => setPlaying(!st.playing));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!st.playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault(); st.t = Math.max(0, Math.min(scenario().seconds, st.t + (e.code === 'ArrowRight' ? .05 : -.05) * (e.shiftKey ? 10 : 1))); drawAll();
  }
});
let lastTick = null;
// Playback redraws at most 30 times a second (a 144 Hz display would otherwise redraw every
// view 144 times a second).
let lastDraw = 0;
function tick(now) {
  if (st.playing && lastTick !== null) {
    st.t += (now - lastTick) / 1000 * st.speed;
    if (st.t >= scenario().seconds) { st.t = scenario().seconds; setPlaying(false); lastDraw = 0; }
    if (now - lastDraw >= 1000 / 30 - 2) { lastDraw = now; drawAll(); }
  }
  lastTick = now; requestAnimationFrame(tick);
}
window.addEventListener('resize', () => drawAll());
window.ac8compare = st;   // debugging

fillSelects(); buildChips(); buildCams(); buildCharts();
loadCond(st.cond, () => { computeExtent(); setTab(st.tab); document.getElementById('note').textContent = scenario().note || ''; requestAnimationFrame(tick); });
})();
</script>
