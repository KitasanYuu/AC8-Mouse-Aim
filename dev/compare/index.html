<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>飞控横评</title>
<style>
/* A side-by-side review of flight controllers: the same decisions against the same enemies.
   First the numbers (every controller on every aircraft, ranked per column), then one shared
   3D replay with a small attitude gauge per controller, then whole-scene timelines (one lane
   per controller) and a short detail chart around the cursor. Dark only, like the telemetry
   page beside it. */
:root {
  --bg: #0e1418;
  --panel: #151d22;
  --rule: #26323a;
  --grid: #1d2830;
  --ink: #dbe4e9;
  --muted: #84959f;
  --aim: #f29a4a;
  --warn: #f06e5c;
  --enemy: #e5534b;
  --elite: #ff6bd6;
  --font: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Consolas", "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.45; }
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px 14px 18px; max-width: 3440px; margin: 0 auto; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 600; }
.note { color: var(--muted); font-size: 12px; }
.label { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 9px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button[aria-pressed=true] { border-color: var(--ink); background: #22303a; }
:focus-visible { outline: 2px solid #4fb3d9; outline-offset: 1px; }
.seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.panel > h2 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0; padding: 8px 12px 0; letter-spacing: .04em; }

/* the board: controllers x (condition x metric), each column ranked */
.board { padding: 8px 12px 10px; overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.board table { width: 100%; }
th, td { padding: 3px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { font-weight: 600; font-size: 12px; }
thead tr.cond th { border-bottom: 1px solid var(--rule); color: var(--ink); text-align: center; }
thead tr.metric th { color: var(--muted); font-weight: 400; font-size: 11px; }
th.gap, td.gap { border-left: 1px solid var(--rule); }
tbody td { font-family: var(--mono); font-size: 12.5px; }
tbody td:first-child { font-family: var(--font); }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
td.cell { position: relative; }
td.cell .rank { font-size: 10px; opacity: .8; margin-left: 4px; }
td.total { font-weight: 700; }
.legend { color: var(--muted); font-size: 11px; margin-top: 6px; }
.legend i { display: inline-block; width: 26px; height: 8px; border-radius: 2px; vertical-align: 0; margin: 0 4px 0 10px; }

/* replay */
.replay { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 8px 12px 12px; }
.replay-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.transport { display: flex; gap: 8px; align-items: center; flex: 1 1 320px; }
.transport input[type=range] { flex: 1; min-width: 140px; accent-color: #4fb3d9; }
.clock { font-family: var(--mono); min-width: 8ch; text-align: right; font-variant-numeric: tabular-nums; }
.replay-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.view { position: relative; height: clamp(320px, 44vh, 620px); background: #10181c; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
.view .hint { position: absolute; right: 8px; bottom: 6px; color: var(--muted); font-size: 11px; pointer-events: none; }
.gauges { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 8px; }
.gauge { border: 1px solid var(--rule); border-radius: 5px; padding: 6px 8px 7px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; background: #121a1f; }
.gauge .name { grid-column: 1 / -1; }
.gauge .name { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.gauge .name button { margin-left: auto; padding: 0 6px; font-size: 11px; }
.gauge .screen { position: relative; min-width: 0; height: clamp(110px, 13vh, 200px); }
.gauge canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.gauge .read { font-family: var(--mono); font-size: 12px; display: grid; align-content: center; gap: 2px; font-variant-numeric: tabular-nums; min-width: 9ch; }
.gauge .read span { color: var(--muted); margin-right: 4px; }
.gauge.crashed { opacity: .55; }
.gauge .flag { color: var(--warn); font-size: 11px; }

/* timelines */
.timeline { position: relative; }
.timeline canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.timeline-wrap { position: relative; cursor: crosshair; }
.detail-wrap { height: 170px; position: relative; }
.detail-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* overview */
.overview { padding: 8px 12px 12px; overflow-x: auto; }
.overview tbody tr[data-scen] { cursor: pointer; }
.overview tbody tr[data-scen]:hover td { outline: 1px solid #2c3a42; }
.overview tr.group td { font-family: var(--font); color: var(--ink); font-weight: 600; background: #111a1f; text-align: left; }
.overview tfoot td { font-family: var(--mono); border-top: 1px solid var(--rule); font-weight: 600; }
.overview tfoot td:first-child { font-family: var(--font); }
.explain { color: var(--muted); font-size: 12px; max-width: 1100px; margin: 10px 0 0; }
.explain b { color: var(--ink); font-weight: 600; }
.empty { padding: 40px; color: var(--muted); text-align: center; }
.empty code { font-family: var(--mono); color: var(--aim); }

@media (max-width: 1100px) {
  .gauges { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="page" id="app">
  <div class="bar">
    <h1>飞控横评</h1>
    <div class="seg" role="group" aria-label="页面">
      <button type="button" id="tabScene" aria-pressed="true">场景</button>
      <button type="button" id="tabOverview" aria-pressed="false">总览</button>
    </div>
    <label class="label" for="scene">场景</label>
    <select id="scene"></select>
    <span class="note" id="note"></span>
  </div>

  <div id="scenePage" class="page" style="padding:0">
    <section class="panel">
      <h2 id="boardTitle">横评</h2>
      <div class="board" id="board"></div>
    </section>

    <section class="panel replay">
      <div class="replay-head">
        <span class="label">回放机体</span>
        <div class="seg" id="conds" role="group" aria-label="回放机体"></div>
        <span class="label">镜头</span>
        <div class="seg" id="cams" role="group" aria-label="镜头"></div>
        <div class="transport">
          <button type="button" id="play">▶ 播放</button>
          <select id="speed" aria-label="播放速度"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>
          <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="时间">
          <span class="clock" id="clock">0.0 s</span>
        </div>
      </div>
      <div class="replay-body">
        <div class="view"><canvas id="view" aria-label="所有飞控同一画面的三维回放"></canvas><span class="hint">拖动旋转 · 滚轮缩放 · 双击复位</span></div>
        <div class="gauges" id="gauges"></div>
      </div>
      <div class="timeline-wrap" id="timelineWrap"><div class="timeline" id="timeline"><canvas id="lanes"></canvas><canvas id="lanesCursor"></canvas></div></div>
      <div class="detail-wrap"><canvas id="detail" aria-label="光标前后 10 秒的偏差角与坡度"></canvas></div>
    </section>
  </div>

  <section class="panel overview" id="overview" hidden></section>
</div>

<script src="results/index.js"></script>
<script>
(() => {
'use strict';
const IDX = window.COMPARE_INDEX;
if (!IDX) { document.getElementById('app').innerHTML = '<div class="empty">还没有结果。先在仓库根目录运行 <code>dev\\compare\\compare.cmd</code>。</div>'; return; }

// ---------- data ----------
// Frame layout written by harness.cpp.
const F = { t: 0, x: 1, y: 2, z: 3, pitch: 4, yaw: 5, roll: 6, ax: 7, ay: 8, az: 9, angle: 10, q: 11, p: 12, r: 13,
            sp: 14, sr: 15, sy: 16, speed: 17, nz: 18, aoa: 19, ex: 20, ey: 21, ez: 22, ep: 23, eyaw: 24, er: 25, tgt: 26, kills: 27 };
const PALETTE = { ours: '#4fb3d9', ours_game: '#f5d04c', upstream_legacy: '#f29a4a', upstream_coord: '#c38df2', pw5: '#5fd38a' };
const EXTRA = ['#ff7aa8', '#8fd0c4', '#b0b8ff', '#e8e8e8'];
const colorOf = (() => { let n = 0; const m = {}; return id => m[id] || (m[id] = PALETTE[id] || EXTRA[n++ % EXTRA.length]); })();
const shortName = c => c.label.replace(/^本仓库 · /, '').replace(/^主仓库 /, '');
const KIND = { capture: '捕获', switch: '换目标', chain: '连续', hold: '保持', pursuit: '脚本追击', single: '单机', multi: '多机', boss: '头目' };
const KINDS = Object.keys(KIND);
const DIRECTION_ONLY = new Set(['capture', 'switch', 'chain', 'hold']);   // the aim is a direction: positions do not matter
// Key metrics per kind: [key, label, unit, better (-1 lower, +1 higher), format]
const pct = v => v < 0 ? null : (v * 100).toFixed(0);
const sec = v => v < 0 ? null : v.toFixed(2);
const deg = v => v < 0 ? null : v.toFixed(1);
const num = v => v.toFixed(0);
const COLS = {
  capture: [['to2', '到 2° 内', 's', -1, sec], ['settle', '稳定 1° 内', 's', -1, sec], ['overshoot', '过冲', '°', -1, deg], ['reversals', '滚转反向', '', -1, num]],
  hold: [['mean_angle', '平均偏差', '°', -1, v => v < 0 ? null : v.toFixed(2)], ['bank_rms', '坡度均方根', '°', -1, deg], ['chatter', '杆来回打', '', -1, num]],
  pursuit: [['mean_angle', '平均偏差', '°', -1, deg], ['within5', '5° 内', '%', 1, pct], ['reversals', '滚转反向', '', -1, num]],
  single: [['mean_angle', '平均偏差', '°', -1, deg], ['within2', '2° 内', '%', 1, pct], ['within5', '5° 内', '%', 1, pct]],
  multi: [['kills', '击落', '', 1, num], ['clear', '全部击落', 's', -1, v => v < 0 ? null : v.toFixed(1)], ['to_shot', '选定到开火', 's', -1, sec], ['on_lead', '机炮瞄准', '%', 1, pct]],
  boss: [['lock_frac', '1 km 锁定', '%', 1, pct], ['on_lead', '机炮瞄准', '%', 1, pct], ['mean_angle', '平均偏差', '°', -1, deg]],
};
COLS.switch = COLS.chain = COLS.capture;

const st = { scen: IDX.scenarios[0].id, cond: IDX.plants[0].id, tab: 'scene', t: 0, playing: false, speed: 1, cam: 'group', follow: IDX.controllers[0].id };
try { const s = JSON.parse(localStorage.getItem('ac8-review') || '{}');
  if (IDX.scenarios.some(x => x.id === s.scen)) st.scen = s.scen;
  if (IDX.plants.some(x => x.id === s.cond)) st.cond = s.cond;
  if (s.tab === 'overview') st.tab = 'overview';
  if (['group', 'follow', 'target'].includes(s.cam)) st.cam = s.cam;
  if (IDX.controllers.some(x => x.id === s.follow)) st.follow = s.follow; } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem('ac8-review', JSON.stringify({ scen: st.scen, cond: st.cond, tab: st.tab, cam: st.cam, follow: st.follow })); } catch (e) { /* ignore */ } }
const scenario = () => IDX.scenarios.find(s => s.id === st.scen);
const runs = () => ((window.COMPARE_DATA || {})[st.cond] || {})[st.scen];
const metricsOf = (cond, scen) => (IDX.metrics[cond] || {})[scen] || {};
function loadCond(cond, then) {
  if (window.COMPARE_DATA && window.COMPARE_DATA[cond]) { then(); return; }
  const s = document.createElement('script'); s.src = `results/data_${cond}.js`; s.onload = then;
  document.head.appendChild(s);
}

// ---------- ranking ----------
// Rank (0 = best) of each value in a column; equal values share a rank; missing values last.
function ranks(values, better) {
  const order = values.map((v, i) => ({ v, i })).filter(o => o.v !== null && Number.isFinite(o.v))
    .sort((a, b) => better < 0 ? a.v - b.v : b.v - a.v);
  const r = values.map(() => null);
  order.forEach((o, k) => { r[o.i] = k > 0 && Math.abs(o.v - order[k - 1].v) < 1e-9 ? r[order[k - 1].i] : k; });
  return r;
}
// best green -> middle amber -> worst red, as a cell background
function rankColor(rank, n) {
  if (rank === null || n < 2) return 'transparent';
  const u = rank / (n - 1);
  const c = u < .5 ? [[44, 120, 80], [130, 112, 40]][0].map((a, k) => a + ([130, 112, 40][k] - a) * u * 2)
                   : [130, 112, 40].map((a, k) => a + ([140, 52, 48][k] - a) * (u - .5) * 2);
  return `rgba(${c.map(Math.round).join(',')}, .55)`;
}
const RANK_MARK = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨'];

// ---------- board: the numbers for the scene, every controller on every aircraft ----------
function drawBoard() {
  const sc = scenario(), cols = COLS[sc.kind] || COLS.capture, list = IDX.controllers, conds = IDX.plants;
  document.getElementById('boardTitle').textContent = `横评 · ${sc.title}（${sc.seconds.toFixed(0)} s）`;
  let html = '<table><thead><tr class="cond"><th></th>';
  for (const c of conds) html += `<th class="gap" colspan="${cols.length + 1}">${c.title}</th>`;
  html += '<th class="gap">平均名次</th></tr><tr class="metric"><th>飞控</th>';
  for (const c of conds) { cols.forEach((m, k) => { html += `<th class="${k ? '' : 'gap'}">${m[1]}${m[2] ? `（${m[2]}）` : ''}</th>`; }); html += '<th>综合代价</th>'; }
  html += '<th class="gap"></th></tr></thead><tbody>';
  // per column ranks
  const cell = {}, rankSum = list.map(() => 0);
  for (const c of conds) {
    const M = metricsOf(c.id, sc.id);
    for (const [key, , , better] of [...cols, ['cost', '', '', -1]]) {
      const vals = list.map(x => M[x.id] ? M[x.id][key] : null).map(v => v === undefined || v === null || (v < 0 && key !== 'cost') ? null : v);
      const r = ranks(vals, better);
      list.forEach((x, i) => { cell[`${c.id}|${key}|${x.id}`] = { v: vals[i], r }; if (key === 'cost' && r[i] !== null) rankSum[i] += r[i]; });
      list.forEach((x, i) => { cell[`${c.id}|${key}|${x.id}`].rank = r[i]; });
    }
  }
  const avgRank = rankSum.map(v => v / conds.length), bestAvg = Math.min(...avgRank);
  list.forEach((x, i) => {
    html += `<tr><td><span class="chip" style="background:${colorOf(x.id)}"></span>${x.label}</td>`;
    for (const c of conds) {
      const M = metricsOf(c.id, sc.id)[x.id] || {};
      cols.forEach(([key, , , , fmt], k) => {
        const e = cell[`${c.id}|${key}|${x.id}`], shown = e.v === null ? '—' : (fmt(e.v) ?? '—');
        html += `<td class="cell ${k ? '' : 'gap'}" style="background:${rankColor(e.rank, list.length)}">${shown}</td>`;
      });
      const e = cell[`${c.id}|cost|${x.id}`];
      const crashed = M.crashed >= 0 ? ' <span title="坠地">✕</span>' : '';
      html += `<td class="cell total" style="background:${rankColor(e.rank, list.length)}">${e.v === null ? '—' : e.v.toFixed(2)}<span class="rank">${e.rank === null ? '' : RANK_MARK[e.rank] || ''}</span>${crashed}</td>`;
    }
    html += `<td class="gap total" style="color:${avgRank[i] === bestAvg ? '#5fd38a' : 'inherit'}">${(avgRank[i] + 1).toFixed(1)}</td></tr>`;
  });
  html += '</tbody></table><div class="legend">每列按名次着色<i style="background:' + rankColor(0, 3) + '"></i>最好<i style="background:' +
          rankColor(1, 3) + '"></i>居中<i style="background:' + rankColor(2, 3) + '"></i>最差 · ✕ 坠地（之后的时间按完全偏离计）· 综合代价越低越好，平均名次按三种机体的综合代价计</div>';
  document.getElementById('board').innerHTML = html;
}

// ---------- vectors (Unreal X north, Y east, Z up -> drawn east/north/up) ----------
const rad = Math.PI / 180;
const enu = v => [v[1], v[0], v[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / n, a[1] / n, a[2] / n]; };
function basis(p, y, r) {   // flight::basis, Unreal coordinates
  p *= rad; y *= rad; r *= rad;
  const f = [Math.cos(p) * Math.cos(y), Math.cos(p) * Math.sin(y), Math.sin(p)];
  const right = [-Math.sin(y), Math.cos(y), 0], up = cross(f, right);
  return { f, r: sub(mul(right, Math.cos(r)), mul(up, Math.sin(r))), u: add(mul(up, Math.cos(r)), mul(right, Math.sin(r))) };
}
// Interpolated frame at t (stored frames are 5-20 a second); wrapping angles take the short way.
const WRAPS = new Set([F.yaw, F.roll, F.eyaw, F.er]);
function frameAt(arr, t) {
  const step = arr.length > 1 ? arr[1][F.t] - arr[0][F.t] : 1;
  const i = Math.max(0, Math.min(arr.length - 1, Math.floor(t / step)));
  const a = arr[i], b = arr[Math.min(i + 1, arr.length - 1)];
  if (a === b || b[F.t] <= a[F.t] || (a.length > F.tgt && a[F.tgt] !== b[F.tgt])) return a;
  const u = Math.max(0, Math.min(1, (t - a[F.t]) / (b[F.t] - a[F.t])));
  return a.map((v, k) => k >= F.tgt ? v : v + (WRAPS.has(k) ? ((b[k] - v + 540) % 360) - 180 : b[k] - v) * u);
}
const ended = (arr, t) => arr.length && t > arr[arr.length - 1][F.t] + 0.3;   // crashed or cleared before t
const crashedRun = id => { const m = metricsOf(st.cond, st.scen)[id]; return !!m && m.crashed >= 0; };
function foeAt(foe, t) {   // [class, 0 / 1 elite / 2 boss, first, last, [[t, x, y, z], ...]]
  if (t < foe[2] || t > foe[3]) return null;
  const pts = foe[4]; if (!pts.length) return null;
  let k = 1; while (k < pts.length - 1 && pts[k][0] < t) k++;
  const a = pts[Math.max(0, k - 1)], b = pts[Math.min(k, pts.length - 1)];
  const u = b[0] > a[0] ? Math.max(0, Math.min(1, (t - a[0]) / (b[0] - a[0]))) : 0;
  const p = [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, a[3] + (b[3] - a[3]) * u];
  const d = sub([b[1], b[2], b[3]], [a[1], a[2], a[3]]);
  return { pos: enu(p), pitch: Math.atan2(d[2], Math.hypot(d[0], d[1]) || 1) / rad, yaw: Math.atan2(d[1], d[0]) / rad };
}

// ---------- canvas ----------
// Canvas sizes from a ResizeObserver (no layout reads while drawing); the backing store is
// capped (pixel ratio 1.5, 0.6 megapixels) since filling pixels is most of a frame's cost.
const MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono');
const sizes = new WeakMap();
let dirty = true;
const sizeWatch = new ResizeObserver(entries => { for (const e of entries) sizes.set(e.target, [e.contentRect.width, e.contentRect.height]); lanesKey = null; dirty = true; });
function fit(canvas, maxPixels = 600000) {
  let size = sizes.get(canvas);
  if (!size) { sizeWatch.observe(canvas); const r = canvas.getBoundingClientRect(); size = [r.width, r.height]; sizes.set(canvas, size); }
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5, Math.sqrt(maxPixels / Math.max(1, size[0] * size[1])));
  const w = Math.max(1, Math.round(size[0])), h = Math.max(1, Math.round(size[1]));
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function camera(C, target, w, h, fov, near = 2) {
  const fwd = norm(sub(target, C)), right = norm(cross(fwd, [0, 0, 1])), up = cross(right, fwd);
  const focal = (h / 2) / Math.tan(fov * rad / 2);

      for (const fr of arr) {
        if (fr[F.t] < t0 - 0.5 || fr[F.t] > t1 + 0.5) continue;
        if (p.get === panels[1].get && last !== null && Math.abs(p.get(fr) - last) > 180) pen = false;   // bank wrap
        const x = X(fr[F.t]), y = Y(p.get(fr)); pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; last = p.get(fr);
      }
      ctx.stroke(); ctx.lineWidth = 1;
    }
  }
  const step = [1, 2, 5].find(v => (t1 - t0) / v <= 12) || 5;
  ctx.fillStyle = '#84959f';
  for (let s = Math.ceil(t0 / step) * step; s <= t1; s += step) ctx.fillText(`${s}`, X(s) - 3, h - 2);
  ctx.strokeStyle = '#f2f5f7'; ctx.globalAlpha = .7; ctx.beginPath(); ctx.moveTo(X(st.t), 2); ctx.lineTo(X(st.t), h - 12); ctx.stroke(); ctx.globalAlpha = 1;
}

// ---------- overview: every scene, every aircraft, every controller, ranked ----------
function drawOverview() {
  const list = IDX.controllers, conds = IDX.plants;
  let html = '<table><thead><tr class="cond"><th></th>';
  for (const c of conds) html += `<th class="gap" colspan="${list.length}">${c.title}</th>`;
  html += '</tr><tr class="metric"><th>场景（综合代价，越低越好）</th>';
  for (const c of conds) list.forEach((x, k) => { html += `<th class="${k ? '' : 'gap'}"><span class="chip" style="background:${colorOf(x.id)}"></span>${shortName(x)}</th>`; });
  html += '</tr></thead><tbody>';
  const rankSum = conds.map(() => list.map(() => 0)), firsts = conds.map(() => list.map(() => 0)), counted = conds.map(() => 0);
  for (const kind of KINDS) {
    const scenes = IDX.scenarios.filter(s => s.kind === kind); if (!scenes.length) continue;
    html += `<tr class="group"><td colspan="${1 + conds.length * list.length}">${KIND[kind]}</td></tr>`;
    for (const sc of scenes) {
      html += `<tr data-scen="${sc.id}"><td>${sc.title}</td>`;
      conds.forEach((c, ci) => {
        const M = metricsOf(c.id, sc.id), vals = list.map(x => M[x.id] ? M[x.id].cost : null), r = ranks(vals, -1);
        if (vals.some(v => v !== null)) counted[ci]++;
        list.forEach((x, k) => {
          if (r[k] !== null) { rankSum[ci][k] += r[k]; if (r[k] === 0) firsts[ci][k]++; }
          const crashed = M[x.id] && M[x.id].crashed >= 0 ? '✕' : '';
          html += `<td class="cell ${k ? '' : 'gap'}" style="background:${rankColor(r[k], list.length)}">${vals[k] === null ? '—' : vals[k].toFixed(1)}${crashed}</td>`;
        });
      });
      html += '</tr>';
    }
  }
  html += '</tbody><tfoot><tr><td>平均名次（越小越好）</td>';
  conds.forEach((c, ci) => { const avg = rankSum[ci].map(v => v / Math.max(counted[ci], 1) + 1), best = Math.min(...avg);
    avg.forEach((v, k) => { html += `<td class="${k ? '' : 'gap'}" style="color:${v === best ? '#5fd38a' : 'inherit'}">${v.toFixed(2)}</td>`; }); });
  html += '</tr><tr><td>第一名次数</td>';
  conds.forEach((c, ci) => { const best = Math.max(...firsts[ci]);
    firsts[ci].forEach((v, k) => { html += `<td class="${k ? '' : 'gap'}" style="color:${v === best ? '#5fd38a' : 'inherit'}">${v}</td>`; }); });
  html += '</tr></tfoot></table>';
  html += `<div class="explain"><p><b>横评</b>：所有飞控在同一机体模型上飞同一组场景；有敌机的场景由同一个虚拟飞行员做同样的决策（选目标、瞄机炮提前量、油门、开火、低空拉起），
    敌机按录像轨迹飞、不会对模拟里的飞机做反应，我方从敌机后方的标准位置出发。所以差别只来自飞控本身。每个格子按这一行同一机体内的名次着色，✕ 表示坠地。</p>
    <p><b>机体</b>：${conds.map(c => c.title).join('；')}。姿态响应、按速度的权限和满油门加速度来自游戏时钟下的录像。</p>
    <p><b>飞控</b>：${list.map(x => `<span style="color:${colorOf(x.id)}">${x.label}</span>（${x.source}）`).join('；')}。点击任一行打开该场景。</p></div>`;
  const box = document.getElementById('overview'); box.innerHTML = html;
  box.querySelectorAll('tr[data-scen]').forEach(tr => tr.addEventListener('click', () => { st.scen = tr.dataset.scen; document.getElementById('scene').value = st.scen; setTab('scene'); selectScene(); }));
}

// ---------- controls ----------
function fillScenes() {
  const sel = document.getElementById('scene');
  sel.innerHTML = KINDS.filter(k => IDX.scenarios.some(s => s.kind === k)).map(k =>
    `<optgroup label="${KIND[k]}">${IDX.scenarios.filter(s => s.kind === k).map(s => `<option value="${s.id}">${s.id} · ${s.title}</option>`).join('')}</optgroup>`).join('');
  sel.value = st.scen;
}
function buildCondButtons() {
  const box = document.getElementById('conds'); box.innerHTML = '';
  for (const c of IDX.plants) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = c.title.replace(/（.*）/, ''); b.title = c.title;
    b.setAttribute('aria-pressed', String(c.id === st.cond));
    b.addEventListener('click', () => { st.cond = c.id; save(); buildCondButtons(); loadCond(st.cond, () => { lanesKey = null; dirty = true; }); });
    box.appendChild(b);
  }
}
function buildCamButtons() {
  const box = document.getElementById('cams'); box.innerHTML = '';
  const follow = IDX.controllers.find(c => c.id === st.follow) || IDX.controllers[0];
  for (const [id, label] of [['group', '全局'], ['follow', `跟随 ${shortName(follow)}`], ['target', '跟随目标']]) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(st.cam === id));
    b.addEventListener('click', () => { st.cam = id; save(); buildCamButtons(); dirty = true; });
    box.appendChild(b);
  }
}
function selectScene() {
  const sc = scenario(); st.t = 0; lanesKey = null;
  st.cam = DIRECTION_ONLY.has(sc.kind) ? 'group' : 'follow'; orbit.yaw = DIRECTION_ONLY.has(sc.kind) ? -30 : 0; orbit.pitch = DIRECTION_ONLY.has(sc.kind) ? 18 : 10; orbit.zoom = 1;
  buildCamButtons(); save();
  document.getElementById('note').textContent = sc.note || '';
  drawBoard(); dirty = true;
}
function setTab(tab) {
  st.tab = tab; save();
  document.getElementById('tabScene').setAttribute('aria-pressed', String(tab === 'scene'));
  document.getElementById('tabOverview').setAttribute('aria-pressed', String(tab === 'overview'));
  document.getElementById('scenePage').hidden = tab !== 'scene';
  document.getElementById('overview').hidden = tab !== 'overview';
  document.getElementById('scene').disabled = tab !== 'scene';
  document.getElementById('note').hidden = tab !== 'scene';
  if (tab === 'overview') drawOverview(); else { lanesKey = null; dirty = true; }
}
// orbit / zoom on the view
{ const canvas = document.getElementById('view'); let last = null;
  canvas.addEventListener('pointerdown', e => { last = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => { last = null; });
  canvas.addEventListener('pointermove', e => { if (!last) return;
    orbit.yaw += (e.clientX - last[0]) * .4; orbit.pitch = Math.max(-80, Math.min(85, orbit.pitch + (e.clientY - last[1]) * .3)); last = [e.clientX, e.clientY]; dirty = true; });
  canvas.addEventListener('wheel', e => { e.preventDefault(); orbit.zoom = Math.max(.15, Math.min(6, orbit.zoom * (e.deltaY > 0 ? 1.12 : 1 / 1.12))); dirty = true; }, { passive: false });
  canvas.addEventListener('dblclick', () => { const d = DIRECTION_ONLY.has(scenario().kind); Object.assign(orbit, { yaw: d ? -30 : 0, pitch: d ? 18 : 10, zoom: 1 }); dirty = true; }); }

document.getElementById('scene').addEventListener('change', e => { st.scen = e.target.value; selectScene(); });
document.getElementById('tabScene').addEventListener('click', () => setTab('scene'));
document.getElementById('tabOverview').addEventListener('click', () => setTab('overview'));
document.getElementById('scrub').addEventListener('input', e => { st.t = e.target.value / 1000 * scenario().seconds; dirty = true; });
document.getElementById('speed').addEventListener('change', e => { st.speed = parseFloat(e.target.value); });
const playBtn = document.getElementById('play');
function setPlaying(on) { st.playing = on; playBtn.textContent = on ? '❚❚ 暂停' : '▶ 播放'; if (on && st.t >= scenario().seconds - 0.01) st.t = 0; }
playBtn.addEventListener('click', () => setPlaying(!st.playing));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!st.playing); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { e.preventDefault(); st.t = Math.max(0, Math.min(scenario().seconds, st.t + (e.code === 'ArrowRight' ? .1 : -.1) * (e.shiftKey ? 10 : 1))); dirty = true; }
});
// one loop: playback, and at most 30 redraws a second
let lastTick = null, lastDraw = 0;
function tick(now) {
  if (st.playing && lastTick !== null) {
    st.t += (now - lastTick) / 1000 * st.speed;
    if (st.t >= scenario().seconds) { st.t = scenario().seconds; setPlaying(false); }
    dirty = true;
  }
  lastTick = now;
  if (dirty && st.tab === 'scene' && now - lastDraw >= 1000 / 30 - 2) {
    dirty = false; lastDraw = now;
    document.getElementById('clock').textContent = `${st.t.toFixed(1)} s`;
    document.getElementById('scrub').value = String(Math.round(st.t / scenario().seconds * 1000));
    drawView(); drawGauges(); drawLanes(); drawDetail();
  }
  requestAnimationFrame(tick);
}
window.ac8review = st;   // debugging
window.ac8draw = () => { drawView(); drawGauges(); drawLanes(); drawDetail(); };

fillScenes(); buildCondButtons(); buildCamButtons(); buildGauges();
loadCond(st.cond, () => { setTab(st.tab); selectScene(); requestAnimationFrame(tick); });
})();
</script>
